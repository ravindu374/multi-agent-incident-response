[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-oncall"
version = "0.1.0"
description = "Adaptive domain-aware routing of incidents across A2A specialist agents (lab + sandbox)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
agents = ["a2a-sdk[http-server]>=1.3,<2", "uvicorn>=0.30"]
# the experience memory in PostgreSQL (controller/memory_pg.py). Pure-Python psycopg on the libpq of a
# PostgreSQL install (found in Program Files, or set A2A_LIBPQ_DIR); "psycopg[binary]" also works where
# Windows Application Control allows its bundled DLL.
db = ["psycopg>=3.1,<4"]

[project.scripts]
oncall = "oncall.cli:main"

[tool.setuptools.packages.find]
include = ["oncall*", "controller*", "agents*"]
