[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-oncall"
version = "0.1.0"
description = "Adaptive domain-aware routing of incidents across A2A specialist agents (lab + sandbox)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
agents = ["a2a-sdk[http-server]>=1.3,<2", "uvicorn>=0.30"]

[project.scripts]
oncall = "oncall.cli:main"

[tool.setuptools.packages.find]
include = ["oncall*", "controller*", "agents*"]
