<text x="24" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">The optimizer prices every option and picks the lowest expected loss (incident syn-7-00046)</text>
<text x="24" y="54" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start">Expected loss = P(not fixed) × priority value + risk of the actions + their cost. Lower is better. Same scale in both panels.</text>
