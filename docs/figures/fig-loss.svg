<text x="24" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="start">The fix is high risk (it changes what the data means), so the plan is 'a human approves'. 'Escalate now' costs 4 + 0.3 × 8 = 6.40 for a P3 incident.</text>
